services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - backend/db/mysql/dev/.env
    ports:
      - "3306:3306"
    volumes:
      - ./backend/db/mysql/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  postgresql:
    image: postgres:17-alpine3.22
    container_name: postgresql
    env_file:
      - backend/db/postgresql/dev/.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/postgresql/postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  dynamodb-local:
    container_name: dynamodb-local
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    build:
      context: ./backend/db/dynamodb
      dockerfile: dev/Dockerfile
    volumes:
      - ./backend/db/dynamodb/dynamodb-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    env_file:
      - ./backend/db/dynamodb/dev/.env
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
      
  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
  
  postgresql-migration:
    container_name: postgresql-migration
    build: 
      context: backend/db/postgresql
      dockerfile: Dockerfile
    env_file:
      - backend/db/postgresql/dev/.env
    volumes:
      - ./backend/db/postgresql/migrations:/migrations
    working_dir: /migrations
    command: sqlx migrate run --source /migrations
    depends_on:
      postgresql:
        condition: service_healthy

  mysql-migration:
    image: migrate/migrate:latest
    container_name: mysql-migration
    volumes:
      - ./backend/db/mysql/migrations:/migrations
    command: ["-path", "/migrations", "-database", "mysql://app_user:app_password@tcp(mysql:3306)/app", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  authservice:
    container_name: authservice
    build: 
      context: backend/authservice
      dockerfile: dev/Dockerfile
    ports:
      - "50053:50053"
    volumes:
      - ./backend/authservice:/app
      - rust-cargo-registry:/usr/local/cargo/registry
      - rust-cargo-git:/usr/local/cargo/git
      - rust-target:/usr/local/cargo/target
    env_file:
      - backend/authservice/dev/.env
    depends_on:
      postgresql:
        condition: service_healthy
      postgresql-migration:
        condition: service_completed_successfully

  profileservice:
    container_name: profileservice
    build: 
      context: backend/profileservice
      dockerfile: dev/Dockerfile
    ports:
      - "50051:50051"
    volumes:  
      - ./backend/profileservice:/app  
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod  
    env_file:
      - backend/profileservice/dev/.env 
    depends_on:
      mysql:
        condition: service_healthy
      mysql-migration:
        condition: service_completed_successfully

  gameservice:
    container_name: gameservice
    build:
      context: backend/gameservice
      dockerfile: dev/Dockerfile
    ports:
      - "50054:50054"
    volumes:
      - ./backend/gameservice:/app
      - rust-cargo-registry:/usr/local/cargo/registry
      - rust-cargo-git:/usr/local/cargo/git
      - rust-target:/usr/local/cargo/target
    env_file:
      - backend/gameservice/dev/.env
    depends_on:
      redis:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy

  bff:
    container_name: bff
    build:
      context: backend/bff
      dockerfile: dev/Dockerfile
    ports:
      - "50052:50052"
    volumes:
      - ./backend/bff:/app
      - rust-cargo-registry:/usr/local/cargo/registry
      - rust-cargo-git:/usr/local/cargo/git
      - rust-target:/usr/local/cargo/target
    env_file:
      - backend/bff/dev/.env
    depends_on:
      authservice:
        condition: service_started
      profileservice:
        condition: service_started
      gameservice:
        condition: service_started

volumes:
  rust-cargo-registry:
  rust-cargo-git:
  rust-target:
  go-build-cache:
  go-mod-cache:
  redis-data:
  dynamodb-data: