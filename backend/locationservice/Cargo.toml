[package]
name = "locationservice"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-stream = "0.3.6"
async-trait = "0.1.89"
aws-config = { version = "1.8.6", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.93.0"
dotenv = "0.15.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features= ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
prost = "0.14.1"
tonic = "0.14.2"
tonic-prost = "0.14.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
